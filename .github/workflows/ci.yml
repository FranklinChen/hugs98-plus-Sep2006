name: Peer credential negative control

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Regress issue #1: inherited STRIP must receive an executable filename.
env:
  STRIP: strip

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 GCC 14 (shipped configure)
            os: ubuntu-24.04
            cc: gcc-14
            regenerate: 'no'
            valgrind: 'yes'
            graphics: ''
    env:
      CC: ${{ matrix.cc }}
      REGENERATE_CONFIGURE: ${{ matrix.regenerate }}
      CI_GRAPHICS: ${{ matrix.graphics }}
      CI_VALGRIND: ${{ matrix.valgrind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 clang autoconf make bison libreadline-dev
          if [ "$CI_VALGRIND" = yes ]; then
            sudo apt-get install -y valgrind
          fi
          if [ "$CI_GRAPHICS" = yes ]; then
            sudo apt-get install -y libx11-dev libxmu-dev libxi-dev libgl-dev libglu1-mesa-dev freeglut3-dev libopenal-dev libalut-dev
          fi
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf readline
      - name: Build, test, and install
        run: bash tools/ci/build.sh
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.graphics || 'core' }}
          path: |
            ci-logs/
            config.log
            packages/*/config.log
          retention-days: 14
